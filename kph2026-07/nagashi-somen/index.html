<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>流しそうめん 3Dモデル プレビュー</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; background: #f4f1ea; }
  header { padding: 12px 20px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { font-size: 13px; color: #555; margin: 0; }
  model-viewer { width: 100%; height: calc(100% - 90px); background: linear-gradient(#dcedf5, #f4f1ea); }
</style>
</head>
<body>
<header>
  <h1>🎋 流しそうめん 3Dモデル (nagashi-somen.glb)</h1>
  <p>実寸大・Y-up・単位m。ドラッグで回転 / ホイールでズーム / 右ドラッグで移動。PLATEAU (Cesium等) にそのまま配置できます。</p>
</header>
<model-viewer src="./nagashi-somen.glb" camera-controls auto-rotate
  shadow-intensity="1" exposure="1.0" ar
  camera-orbit="45deg 65deg 6m" min-camera-orbit="auto auto 1m" max-camera-orbit="auto auto 30m">
</model-viewer>
</body>
</html>
